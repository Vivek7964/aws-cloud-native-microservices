apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: watchn-gateway
  namespace: watchn
spec:
  gatewayClassName: aws-alb

  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: watchn-public-alb

  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
