apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: watchn
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: watchn

  sources:

    # ActiveMQ
    - repoURL: https://github.com/Vivek7964/microservice-demo.git
      targetRevision: master
      path: deploy/kubernetes/activemq/chart
      helm:
        releaseName: activemq
        parameters:
          - name: image.tag
            value: v2

    # Catalog
    - repoURL: https://github.com/Vivek7964/microservice-demo.git
      targetRevision: master
      path: src/catalog/chart
      helm:
        releaseName: catalog
        parameters:
          - name: image.tag
            value: v1

    # Carts
    - repoURL: https://github.com/Vivek7964/microservice-demo.git
      targetRevision: master
      path: src/cart/chart
      helm:
        releaseName: carts
        parameters:
          - name: image.tag
            value: v1

    # Orders
    - repoURL: https://github.com/Vivek7964/microservice-demo.git
      targetRevision: master
      path: src/orders/chart
      helm:
        releaseName: orders
        parameters:
          - name: image.tag
            value: v1
          - name: messaging.activemq.brokerUrl
            value: tcp://activemq-0.activemq:61616

    # Checkout
    - repoURL: https://github.com/Vivek7964/microservice-demo.git
      targetRevision: master
      path: src/checkout/chart
      helm:
        releaseName: checkout
        parameters:
          - name: image.tag
            value: v1

    # Assets
    - repoURL: https://github.com/Vivek7964/microservice-demo.git
      targetRevision: master
      path: src/assets/chart
      helm:
        releaseName: assets
        parameters:
          - name: image.tag
            value: v1

    # UI
    - repoURL: https://github.com/Vivek7964/microservice-demo.git
      targetRevision: master
      path: src/ui/chart
      helm:
        releaseName: ui
        parameters:
          - name: image.tag
            value: v1

  syncPolicy:
    syncOptions:
      - CreateNamespace=true