services:
  checkout:
    build:
      context: .
      dockerfile: ../../images/nodejs/Dockerfile
    image: microservices-demo/checkout
    hostname: checkout
    restart: always
    cap_drop:
      - all
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3

  waiter:
    image: busybox:1.33.0
    restart: 'no'
    cap_drop:
      - all
    command: echo 'Ready'
    depends_on:
      checkout:
        condition: service_healthy