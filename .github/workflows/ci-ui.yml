name: UI CI

on:
  push:
    branches:
      - master
    paths:
      - 'src/ui/**'
      - 'images/java17/**'
      - '.github/workflows/ci-ui.yml'

  pull_request:
    branches:
      - master
    paths:
      - 'src/ui/**'
      - 'images/java17/**'
      - '.github/workflows/ci-ui.yml'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: watchn/ui

jobs:
  ui:
    name: UI CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run UI tests
        working-directory: src/ui
        run: ./mvnw test

      - name: Build UI JAR
        working-directory: src/ui
        run: ./mvnw package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build UI image
        run: |
          docker build \
            -f images/java17/Dockerfile \
            --build-arg JAR_PATH=target/ui-0.0.1-SNAPSHOT.jar \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            src/ui

      - name: Scan UI image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push UI image to ECR
        run: |
          docker push \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}