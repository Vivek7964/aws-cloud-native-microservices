name: Catalog CI

on:
  push:
    branches:
      - master
    paths:
      - 'src/catalog/**'
      - '.github/workflows/ci-catalog.yml'

  pull_request:
    branches:
      - master
    paths:
      - 'src/catalog/**'
      - '.github/workflows/ci-catalog.yml'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: watchn/catalog

jobs:
  catalog:
    name: Catalog CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/catalog/go.mod
          cache: true

      - name: Run Catalog tests
        working-directory: src/catalog
        run: go test ./...

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Catalog image
        run: |
          docker build \
            -f src/catalog/Dockerfile \
            --build-arg MAIN_PATH=. \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            src/catalog

      - name: Scan Catalog image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Catalog image to ECR
        run: |
          docker push \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}