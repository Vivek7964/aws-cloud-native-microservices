name: Watchn CI

on:
  push:
    branches:
      - master
    paths:
      - 'src/catalog/**'
      - '.github/workflows/ci.yml'

  pull_request:
    branches:
      - master
    paths:
      - 'src/catalog/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: watchn/catalog

jobs:
  catalog:
    name: Catalog CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/catalog/go.mod
          cache: true

      - name: Run Catalog tests
        working-directory: src/catalog
        run: go test ./...
      
      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)

          echo "OIDC claims:"
          echo "$PAYLOAD" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_owner,
            ref,
            event_name
          }'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::945512081289:role/watchn-dev-github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Catalog image
        run: |
          docker build \
            -f src/catalog/Dockerfile \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            src/catalog

      - name: Scan Catalog image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Catalog image to ECR
        run: |
          docker push \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

# OIDC trust test
